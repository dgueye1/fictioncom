{const {data:{session}}=await db.auth.getSession();if(!session){document.getElementById('access-status').textContent='Sign in with the moderator account to view this page.';}else{const r=await fetch('/api/moderator/launch-checklist',{headers:{Authorization:'Bearer '+session.access_token},cache:'no-store'});if(r.ok){document.body.innerHTML=await r.text();document.title='Public beta launch setup — FictionCom';}else document.getElementById('access-status').textContent=r.status===403?'This page is available only to the moderator.':'Checklist unavailable. Please try again.';}}catch{document.getElementById('access-status').textContent='Unable to check access. Please try again.';}</script></body></html>
