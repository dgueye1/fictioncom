<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Moderator access — FictionCom</title><link rel="stylesheet" href="/styles.css"></head><body><main class="policy-page"><h1>Moderator access</h1><p id="access-status">Checking your access…</p><a href="/">Back to FictionCom</a></main><script type="module">import {createClient} from 'https://esm.sh/@supabase/supabase-js@2.57.4';import {SUPABASE_URL,SUPABASE_KEY} from '/config.js';const db=createClient(SUPABASE_URL,SUPABASE_KEY);try{const {data:{session}}=await db.auth.getSession();if(!session){document.getElementById('access-status').textContent='Sign in with the moderator account to view this page.';}else{const r=await fetch('/api/moderator/launch-checklist',{headers:{Authorization:'Bearer '+session.access_token},cache:'no-store'});if(r.ok){document.body.innerHTML=await r.text();document.title='Public beta launch setup — FictionCom';}else document.getElementById('access-status').textContent=r.status===403?'This page is available only to the moderator.':'Checklist unavailable. Please try again.';}}catch{document.getElementById('access-status').textContent='Unable to check access. Please try again.';}</script></body></html>
