<script>
try{
  var saved=localStorage.getItem('fictioncom-theme');
  var theme=saved||(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark');
  document.documentElement.dataset.theme=theme;
  var meta=document.querySelector('meta[name=theme-color]');
  if(meta)meta.content=theme==='light'?'#ffffff':'#000000';
}catch(e){}

<body>

<div class="app-shell">
<aside class="ig-nav">

    <button type="button" data-view="profile" class="nav-item">
      <span class="ico" aria-hidden="true"><svg class="ico-line" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.25" fill="none" stroke="currentColor" stroke-width="1.7"/><circle cx="12" cy="10" r="2.4" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M7.2 17.2a5 5 0 0 1 9.6 0" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg><svg class="ico-fill" viewBox="0 0 24 24"><path d="M12 2.6a9.4 9.4 0 1 0 0 18.8 9.4 9.4 0 0 0 0-18.8Zm0 4.2a2.7 2.7 0 1 1 0 5.4 2.7 2.7 0 0 1 0-5.4Zm0 12.2a7.2 7.2 0 0 1-5.4-2.4 4.6 4.6 0 0 1 10.8 0A7.2 7.2 0 0 1 12 19Z" fill="currentColor"/></svg></span>
      <span>Profile</span>
    </button>
  </nav>
  <div class="nav-foot">
    <div id="more-panel" class="more-panel" hidden>
      <button type="button" data-view="theory">Theories</button>
      <button type="button" data-view="chapters">Chapter reviews</button>
      <button type="button" data-view="episodes">Episode reviews</button>
      <button type="button" id="discover">Find people</button>
      <button type="button" id="my-series">My anime &amp; manga</button>
      <button type="button" id="rules">Community rules</button>
      <button type="button" id="refresh">Refresh</button>
      <button type="button" id="account">Sign in</button>
    </div>
    <button type="button" id="theme-toggle" class="nav-item" aria-label="Toggle color theme">
      <span class="ico" aria-hidden="true"><svg class="icon-moon" viewBox="0 0 24 24"><path d="M16 3.2A8.5 8.5 0 1 0 20.8 15 7 7 0 0 1 16 3.2Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg><svg class="icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6 17 7M7 17l-1.4 1.4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></span>
      <span>Theme</span>

      <span>More</span>
    </button>

<header class="topbar">
  <button type="button" id="topbar-back" class="icon-btn topbar-back" hidden aria-label="Back"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M15 5 8 12l7 7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  <a class="brand wordmark" href="#feed">FictionCom</a>
  <div class="header-tools">
    <button type="button" id="theme-toggle-mobile" class="icon-btn" aria-label="Toggle color theme">
      <svg class="icon-moon" viewBox="0 0 24 24" width="22" height="22"><path d="M16 3.2A8.5 8.5 0 1 0 20.8 15 7 7 0 0 1 16 3.2Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
      <svg class="icon-sun" viewBox="0 0 24 24" width="22" height="22"><circle cx="12" cy="12" r="3.2" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6 17 7M7 17l-1.4 1.4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
    </button>
    <button type="button" id="notifications-mobile" class="icon-btn notif-btn" aria-label="Notifications">
      <svg viewBox="0 0 24 24" width="24" height="24"><path d="M12 20.2s-7.2-4.4-7.2-9.1A4.4 4.4 0 0 1 12 7.6a4.4 4.4 0 0 1 7.2 3.5c0 4.7-7.2 9.1-7.2 9.1Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
      <span class="notification-dot" hidden></span>
    </button>
    <button type="button" data-view="messages" class="icon-btn" aria-label="Messages">
      <svg viewBox="0 0 24 24" width="24" height="24"><path d="M21 4.5 3.8 11.2c-.9.4-.8 1.6.1 1.8l6.2 1.5 1.6 6.1c.3.9 1.5.9 1.8 0L21 4.5Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
      <span class="chat-unread-badge" hidden></span>
    </button>
  </div>
</header>

<div class="layout">
<main>
  <div class="section-heading">
    <button type="button" id="page-back" class="page-back" hidden aria-label="Back"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M15 5 8 12l7 7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <div>
      <p class="eyebrow">FictionCom</p>
      <h1 id="view-title">Home</h1>
    </div>
  </div>
  <section id="story-strip" class="story-strip" aria-label="Stories"></section>
  <nav id="feed-tabs" class="feed-tabs" aria-label="Feed sections" hidden>
    <button type="button" data-feed="feed" aria-selected="true">For you</button>
    <button type="button" data-feed="theory">Theories</button>
    <button type="button" data-feed="chapters">Chapter reviews</button>
    <button type="button" data-feed="episodes">Episode reviews</button>
  </nav>
  <div id="feed-chips" class="feed-chips" hidden>
    <button type="button" id="open-feed-filter">Series</button>
    <button type="button" id="feed-series-chip" class="feed-series-chip" hidden></button>
  </div>
  <div class="create-row"><p class="small">Browse freely. Sign in to join the conversation.</p><button id="compose" class="primary" type="button">Create</button></div>
  <div id="intro" class="intro intro-slim" hidden><p>Find your people between episodes.</p><button type="button" id="intro-dismiss" aria-label="Dismiss">×</button></div>
  <div id="feed-filter-sheet" class="mini-sheet" hidden>
    <button type="button" id="feed-filter-backdrop" class="mini-sheet-backdrop" aria-label="Close series filter"></button>
    <form id="filters" class="filters mini-sheet-card">
      <div class="sheet-handle" aria-hidden="true"></div>
      <h3>Series</h3>
      <label>Series<input id="series-filter" placeholder="Search anime or manga" maxlength="100"></label>
      <label class="sort-label">Sort<select id="discussion-sort"><option value="recommended">For you</option><option value="top" hidden>Top</option><option value="newest">Newest first</option><option value="oldest">Oldest first</option><option value="episode-asc">Episode / chapter: low to high</option><option value="episode-desc">Episode / chapter: high to low</option></select></label>
      <div class="form-actions"><button class="primary" type="submit">Apply</button><button id="clear-series" type="button">Clear</button></div>
    </form>
  </div>
  <div class="community-tools"><button id="series-page" type="button" hidden>View series page</button></div>
  <div id="content" aria-live="polite"></div>
</main>
<aside class="rail" aria-label="Suggestions">
  <div id="rail-switch" class="rail-switch"></div>
  <div class="rail-suggest">
    <div class="rail-suggest-head"><span>Suggested for you</span><button type="button" id="rail-see-all" class="text-button">See all</button></div>
    <div id="rail-suggestions"></div>
  </div>
</aside>
</div>

<nav class="tabbar" aria-label="Mobile">
  <button type="button" data-view="feed" class="active" aria-label="Home">
    <span class="ico" aria-hidden="true"><svg class="ico-line" viewBox="0 0 24 24"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1v-9.5Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg><svg class="ico-fill" viewBox="0 0 24 24"><path d="M12 3.2 3.2 10.4V20a1 1 0 0 0 1 1H9v-6h6v6h4.8a1 1 0 0 0 1-1v-9.6L12 3.2Z" fill="currentColor"/></svg></span>
  </button>
  <button type="button" data-view="explore" aria-label="Explore">
    <span class="ico" aria-hidden="true"><svg class="ico-line" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.25" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="m15.2 8.8-1.4 4.2-4.2 1.4 1.4-4.2 4.2-1.4Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg><svg class="ico-fill" viewBox="0 0 24 24"><path d="M12 2.6a9.4 9.4 0 1 0 0 18.8 9.4 9.4 0 0 0 0-18.8Zm3.7 6.1-1.6 4.7-4.7 1.6 1.6-4.7 4.7-1.6Z" fill="currentColor"/></svg></span>
  </button>
  <button type="button" id="tab-create" data-create="post" aria-label="Create">
    <span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17" rx="5" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M12 8v8M8 12h8" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></span>
  </button>
  <button type="button" data-view="messages" aria-label="Messages">
    <span class="ico" aria-hidden="true"><svg class="ico-line" viewBox="0 0 24 24"><path d="M21 4.5 3.8 11.2c-.9.4-.8 1.6.1 1.8l6.2 1.5 1.6 6.1c.3.9 1.5.9 1.8 0L21 4.5Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg><svg class="ico-fill" viewBox="0 0 24 24"><path d="m21.6 3.2-17.8 7c-1.2.5-1.1 2.2.1 2.5l6.4 1.6 1.7 6.3c.3 1.2 2 1.2 2.4 0l7.2-17.4Z" fill="currentColor"/></svg></span>
    <span class="chat-unread-badge" hidden></span>
  </button>
  <button type="button" data-view="profile" aria-label="Profile">
    <span class="ico" aria-hidden="true"><svg class="ico-line" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.25" fill="none" stroke="currentColor" stroke-width="1.7"/><circle cx="12" cy="10" r="2.4" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M7.2 17.2a5 5 0 0 1 9.6 0" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg><svg class="ico-fill" viewBox="0 0 24 24"><path d="M12 2.6a9.4 9.4 0 1 0 0 18.8 9.4 9.4 0 0 0 0-18.8Zm0 4.2a2.7 2.7 0 1 1 0 5.4 2.7 2.7 0 0 1 0-5.4Zm0 12.2a7.2 7.2 0 0 1-5.4-2.4 4.6 4.6 0 0 1 10.8 0A7.2 7.2 0 0 1 12 19Z" fill="currentColor"/></svg></span>
  </button>
</nav>
</div>

<div id="notif-root" class="notif-root" hidden>
  <button type="button" id="notif-backdrop" class="notif-backdrop" aria-label="Close notifications"></button>
  <aside id="notif-panel" class="notif-panel" role="dialog" aria-modal="true" aria-labelledby="notif-title">
    <header class="notif-head">
      <button type="button" id="notif-close" class="notif-back" aria-label="Close notifications">
        <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M15 5 8 12l7 7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <h2 id="notif-title">Notifications</h2>
      <button type="button" id="read-all" class="text-button">Mark all read</button>
    </header>
    <div id="notif-scroll" class="notif-scroll"></div>
  </aside>
</div>

<div id="lightbox" class="lightbox" hidden>
  <button type="button" id="lightbox-close" aria-label="Close photo">×</button>
  <img id="lightbox-img" alt="">
</div>

<div id="ig-layer" class="ig-layer" hidden>
  <button type="button" id="ig-layer-backdrop" class="ig-layer-backdrop" aria-label="Close"></button>
  <section id="post-detail" class="post-detail" hidden>
    <button type="button" id="post-detail-close" class="post-detail-close" aria-label="Close">×</button>
    <div id="post-detail-media" class="post-detail-media"></div>
    <div id="post-detail-side" class="post-detail-side"></div>
  </section>
  <section id="comment-sheet" class="comment-sheet" hidden role="dialog" aria-modal="true" aria-labelledby="comment-sheet-title">
    <div class="sheet-handle" id="comment-sheet-handle"></div>
    <header class="sheet-head"><h2 id="comment-sheet-title">Comments</h2><button type="button" id="comment-sheet-close" aria-label="Close comments">×</button></header>
    <div id="comment-sheet-body" class="comment-sheet-body"></div>
    <div id="comment-sheet-dock" class="comment-dock"></div>
  </section>
  <section id="share-sheet" class="share-sheet" hidden role="dialog" aria-modal="true" aria-labelledby="share-sheet-title">
    <div class="sheet-handle" id="share-sheet-handle"></div>
    <header class="sheet-head"><h2 id="share-sheet-title">Share</h2><button type="button" id="share-sheet-close" aria-label="Close share">×</button></header>
    <div id="share-sheet-body" class="share-sheet-body"></div>
  </section>
</div>
<dialog id="modal"><button id="close-modal" class="close" type="button" aria-label="Close dialog">×</button><div id="modal-body"></div></dialog>
<div id="toast" role="status"></div>
<footer class="public-footer"><a href="privacy.html">Privacy</a><a href="terms.html">Terms &amp; rules</a><button id="public-support" type="button">Support</button><button id="public-feedback" type="button">Feedback</button><span>For fans age 14 and up</span></footer>
<script type="module" src="/monitoring.js"></script>
